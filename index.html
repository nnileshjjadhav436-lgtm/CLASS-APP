<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Attendance System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
      color: #111827;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .video-card, .action-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      background: #fafafa;
    }
    video {
      width: 100%;
      border-radius: 6px;
      background: #000;
      transform: scaleX(-1);
    }
    canvas {
      display: none;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-success:hover {
      background-color: #15803d;
    }
    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      background: #e5e7eb;
      color: #1f2937;
      min-height: 48px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Face ID Attendance Portal</h1>

  <div class="grid">
    <!-- Camera Viewport -->
    <div class="video-card">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="snapshot"></canvas>
      <button class="btn-primary" onclick="startCamera()">Start Camera</button>
    </div>

    <!-- Actions -->
    <div class="action-card">
      <h3>Register Student</h3>
      <div class="form-group">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="e.g. 101">
      </div>
      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="e.g. Rahul Sharma">
      </div>
      <button class="btn-primary" onclick="registerStudent()">Register Face</button>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;">

      <h3>Mark Attendance</h3>
      <button class="btn-success" onclick="markAttendance()">Verify & Log Attendance</button>

      <div class="status-box" id="statusMessage">System ready. Start camera to proceed.</div>
    </div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://flame-ian-surveillance-ethics.trycloudflare.com";
  const video = document.getElementById("webcam");
  const canvas = document.getElementById("snapshot");
  const statusMessage = document.getElementById("statusMessage");

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });
      video.srcObject = stream;
      statusMessage.textContent = "Camera connected successfully.";
    } catch (err) {
      statusMessage.textContent = "Camera access denied: " + err.message;
    }
  }

  function captureFrame() {
    if (!video.srcObject) {
      statusMessage.textContent = "Error: Please start the camera first.";
      return null;
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg");
  }

  async function registerStudent() {
    const studentId = document.getElementById("studentId").value.trim();
    const studentName = document.getElementById("studentName").value.trim();
    const imageData = captureFrame();

    if (!studentId || !studentName) {
      statusMessage.textContent = "Error: Student ID and Name are required.";
      return;
    }
    if (!imageData) return;

    statusMessage.textContent = "Registering student...";

    try {
      const res = await fetch(`${BACKEND_URL}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          student_id: studentId,
          name: studentName,
          image: imageData
        })
      });
      const data = await res.json();
      statusMessage.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      statusMessage.textContent = "Connection error: " + err.message;
    }
  }

  async function markAttendance() {
    const imageData = captureFrame();
    if (!imageData) return;

    statusMessage.textContent = "Verifying face...";

    try {
      const res = await fetch(`${BACKEND_URL}/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageData })
      });
      const data = await res.json();
      statusMessage.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      statusMessage.textContent = "Connection error: " + err.message;
    }
  }
</script>

</body>
</html>

python -c '
html = """<!DOCTYPE html>
<html lang=\"en\">
<head>
<meta charset=\"UTF-8\">
<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
<title>Local Face Attendance & Videos</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; text-align: center; }
  h2 { color: #38bdf8; margin-bottom: 8px; }
  h3 { color: #cbd5e1; margin-top: 0; }
  video, canvas { width: 100%; max-width: 380px; border-radius: 12px; background: #1e293b; border: 2px solid #334155; }
  .box { background: #1e293b; border-radius: 12px; padding: 14px; margin: 14px auto; max-width: 400px; text-align: left; }
  input, button { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; border-radius: 8px; border: none; font-size: 14px; }
  input { background: #0f172a; color: #fff; border: 1px solid #475569; }
  button { font-weight: bold; cursor: pointer; color: #fff; }
  .btn-blue { background: #0284c7; }
  .btn-green { background: #16a34a; font-size: 16px; padding: 12px; }
  .btn-purple { background: #6366f1; }
  .btn-amber { background: #d97706; }
  .btn-red { background: #dc2626; padding: 6px 10px; width: auto; font-size: 12px; }
  .btn-edit { background: #2563eb; padding: 6px 10px; width: auto; font-size: 12px; margin-right: 6px; }
  #msg { font-weight: bold; margin: 10px 0; color: #facc15; text-align: center; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { border: 1px solid #334155; padding: 6px; text-align: center; }
  th { background: #334155; }
  .P { color: #4ade80; font-weight: bold; }
  .A { color: #f87171; font-weight: bold; }
  .vid-item { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .vid-title { font-weight: bold; color: #38bdf8; word-break: break-word; }
  .vid-actions { display: flex; gap: 4px; }
</style>
</head>
<body>
<h2>Smart Attendance & Content</h2>
<div id=\"msg\">Tap Start Camera to begin</div>
<video id=\"video\" autoplay playsinline></video>
<canvas id=\"canvas\" style=\"display:none;\"></canvas>

<div style=\"max-width:400px; margin:auto;\"><button class=\"btn-blue\" onclick=\"startCamera()\">Start Camera</button><button class=\"btn-green\" onclick=\"markAttendance()\">Face ID Scan (Mark P)</button></div>

<div class=\"box\">
  <h3>New Registration</h3>
  <input id=\"stu_id\" placeholder=\"Student ID (e.g. 101)\">
  <input id=\"stu_name\" placeholder=\"Student Name\">
  <button class=\"btn-purple\" onclick=\"registerFace()\">Register Face</button>
</div>

<div class=\"box\">
  <h3>Daily Attendance Sheet</h3>
  <button class=\"btn-blue\" style=\"background:#475569;\" onclick=\"loadRoster()\">Refresh Roster</button>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Time</th></tr></thead>
    <tbody id=\"roster\"></tbody>
  </table>
</div>

<div class=\"box\">
  <h3>Video Manager</h3>
  <input id=\"vid_title\" placeholder=\"Video Title (e.g. Lecture 1 / Play Intro)\">
  <input id=\"vid_url\" placeholder=\"Video URL or Local File Path\">
  <button id=\"vid_btn\" class=\"btn-amber\" onclick=\"saveVideo()\">Add New Video</button>
  <button id=\"vid_cancel\" style=\"display:none; background:#64748b;\" onclick=\"resetVideoForm()\">Cancel Edit</button>

  <div id=\"video_list\" style=\"margin-top: 14px;\"></div>
</div>

<script>
const video = document.getElementById(\"video\");
const canvas = document.getElementById(\"canvas\");
const msg = document.getElementById(\"msg\");
let editVideoId = null;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: \"user\" } });
    video.srcObject = stream;
    msg.innerText = \"Camera active!\";
  } catch (err) {
    msg.innerText = \"Camera Error: \" + err.message;
  }
}

function captureFrame() {
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  canvas.getContext(\"2d\").drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL(\"image/jpeg\", 0.8);
}

async function registerFace() {
  const id = document.getElementById(\"stu_id\").value.trim();
  const name = document.getElementById(\"stu_name\").value.trim();
  if (!id || !name) return alert(\"Enter ID and Name!\");
  msg.innerText = \"Registering face...\";
  const res = await fetch(\"/register\", {
    method: \"POST\",
    headers: {\"Content-Type\": \"application/json\"},
    body: JSON.stringify({ student_id: id, name: name, image: captureFrame() })
  });
  const data = await res.json();
  msg.innerText = data.message || \"Registered!\";
  loadRoster();
}

async function markAttendance() {
  msg.innerText = \"Scanning face...\";
  const res = await fetch(\"/verify\", {
    method: \"POST\",
    headers: {\"Content-Type\": \"application/json\"},
    body: JSON.stringify({ image: captureFrame() })
  });
  const data = await res.json();
  msg.innerText = data.message || \"Scan complete!\";
  loadRoster();
}

async function loadRoster() {
  try {
    const res = await fetch(\"/daily-sheet\");
    const data = await res.json();
    const tbody = document.getElementById(\"roster\");
    tbody.innerHTML = \"\";
    (data.roster || []).forEach(r => {
      tbody.innerHTML += `<tr><td>${r.student_id}</td><td>${r.name}</td><td class=\"${r.status}\">${r.status}</td><td>${r.time}</td></tr>`;
    });
  } catch(e) {}
}

async function loadVideos() {
  try {
    const res = await fetch(\"/videos\");
    const list = await res.json();
    const container = document.getElementById(\"video_list\");
    container.innerHTML = \"\";
    if (list.length === 0) {
      container.innerHTML = \"<p style='color:#94a3b8; font-size:13px;'>No videos added yet.</p>\";
      return;
    }
    list.forEach(v => {
      container.innerHTML += `
        <div class=\"vid-item\">
          <div>
            <div class=\"vid-title\">${v.title}</div>
            <a href=\"${v.url}\" target=\"_blank\" style=\"color:#94a3b8; font-size:12px;\">Open link</a>
          </div>
          <div class=\"vid-actions\">
            <button class=\"btn-edit\" onclick=\"startEditVideo(\x27${v.id}\x27, \x27${escape(v.title)}\x27, \x27${escape(v.url)}\x27)\">Edit</button>
            <button class=\"btn-red\" onclick=\"deleteVideo(\x27${v.id}\x27)\">Delete</button>
          </div>
        </div>
      `;
    });
  } catch(e) {}
}

async function saveVideo() {
  const title = document.getElementById(\"vid_title\").value.trim();
  const url = document.getElementById(\"vid_url\").value.trim();
  if (!title || !url) return alert(\"Enter both video title and URL!\");

  const endpoint = editVideoId ? \"/videos/edit\" : \"/videos/add\";
  const payload = editVideoId ? { id: editVideoId, title, url } : { title, url };

  await fetch(endpoint, {
    method: \"POST\",
    headers: {\"Content-Type\": \"application/json\"},
    body: JSON.stringify(payload)
  });

  resetVideoForm();
  loadVideos();
}

function startEditVideo(id, encTitle, encUrl) {
  editVideoId = id;
  document.getElementById(\"vid_title\").value = unescape(encTitle);
  document.getElementById(\"vid_url\").value = unescape(encUrl);
  document.getElementById(\"vid_btn\").innerText = \"Save Video Changes\";
  document.getElementById(\"vid_cancel\").style.display = \"block\";
}

function resetVideoForm() {
  editVideoId = null;
  document.getElementById(\"vid_title\").value = \"\";
  document.getElementById(\"vid_url\").value = \"\";
  document.getElementById(\"vid_btn\").innerText = \"Add New Video\";
  document.getElementById(\"vid_cancel\").style.display = \"none\";
}

async function deleteVideo(id) {
  if (!confirm(\"Are you sure you want to delete this video?\")) return;
  await fetch(\"/videos/delete\", {
    method: \"POST\",
    headers: {\"Content-Type\": \"application/json\"},
    body: JSON.stringify({ id: id })
  });
  loadVideos();
}

window.onload = () => { loadRoster(); loadVideos(); };
</script>
</body>
</html>
"""
open("index.html", "w").write(html)
print("index.html successfully updated with video controls!")
'
